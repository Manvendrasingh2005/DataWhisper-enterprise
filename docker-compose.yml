version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: datawhisper_db
    restart: always
    environment:
      POSTGRES_DB: datawhisper
      POSTGRES_USER: datawhisper_user
      POSTGRES_PASSWORD: datawhisper_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datawhisper_user -d datawhisper"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datawhisper_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://datawhisper_user:datawhisper_password@db:5432/datawhisper
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-production-secret-key-12345}
      DEBUG: "False"
    ports:
      - "8000:8000"

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datawhisper_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
