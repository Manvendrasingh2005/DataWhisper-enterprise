services:
  # DataWhisper Backend Web Service
  - type: web
    name: datawhisper-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: datawhisper-db
          property: connectionString

  # DataWhisper Static Frontend Web Service
  - type: web
    name: datawhisper-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    plan: free
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: datawhisper-backend
          property: host

databases:
  - name: datawhisper-db
    plan: free
    databaseName: datawhisper
    user: datawhisper_user
